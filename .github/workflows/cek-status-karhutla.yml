name: FireSentry - Cek Status Karhutla

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode manual: normal atau test-telegram"
        required: true
        default: normal
        type: choice
        options:
          - normal
          - test-telegram

permissions:
  contents: write

concurrency:
  group: firesentry-karhutla-check
  cancel-in-progress: false

jobs:
  cek-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cek BMKG + NASA FIRMS + Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          FIRESENTRY_BASE_URL: ${{ secrets.FIRESENTRY_BASE_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TEST_TELEGRAM: ${{ github.event.inputs.mode == 'test-telegram' && 'true' || 'false' }}
        run: node scripts/cek-status-karhutla.mjs

      - name: Simpan status dan data hotspot ke repository
        run: |
          git config user.name "FireSentry Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status-notifikasi-terakhir.json data/hotspot-live.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data untuk di-commit."
          else
            git commit -m "chore: update FireSentry live status and hotspots"
            git push
          fi
